<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lernplaner">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lernplaner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,750&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: Seitenleiste + Hauptspalte ab 900px, darunter Tab-Leiste unten (iPhone). Zeiten in Mono, damit die Uhrzeiten-Spalte sauber fluchtet. */
:root{
  --bg:#F2F4F7;
  --surface:#FFFFFF;
  --ink:#121826;
  --muted:#5B6576;
  --line:#DCE1E8;
  --accent:#2550E0;
  --accent-soft:#E7ECFC;
  --accent-ink:#FFFFFF;
  --good:#1E9455;
  --warn:#B87308;
  --bad:#D23F3F;
  --shadow:0 1px 2px rgba(18,24,38,.06),0 4px 16px rgba(18,24,38,.06);
  --f-display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",-apple-system,system-ui,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:12px;
  --tabh:62px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E121A; --surface:#171C27; --ink:#E9EDF4; --muted:#98A2B3; --line:#2A3140;
    --accent:#6C8CFF; --accent-soft:#1F2A4A; --accent-ink:#0B1020;
    --good:#4CC284; --warn:#E3A43A; --bad:#F06B6B;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E121A; --surface:#171C27; --ink:#E9EDF4; --muted:#98A2B3; --line:#2A3140;
  --accent:#6C8CFF; --accent-soft:#1F2A4A; --accent-ink:#0B1020;
  --good:#4CC284; --warn:#E3A43A; --bad:#F06B6B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;font-family:var(--f-display);text-wrap:balance;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100%}
html,body{overflow-x:hidden}
.main{min-width:0}
.side{display:none}
.main{padding:calc(env(safe-area-inset-top) + 16px) max(16px,env(safe-area-inset-right)) calc(var(--tabh) + env(safe-area-inset-bottom) + 90px) max(16px,env(safe-area-inset-left));max-width:820px;width:100%;margin:0 auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;height:calc(var(--tabh) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);z-index:20}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);text-decoration:none;font-size:11.5px;font-weight:500}
.tabbar a svg{width:24px;height:24px}
.tabbar a.on{color:var(--accent)}
@media (min-width:900px){
  .app{grid-template-columns:250px minmax(0,1fr)}
  .tabbar{display:none}
  .side{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px;border-right:1px solid var(--line);background:var(--surface)}
  .main{padding:28px 32px 120px}
}
.brand{font-family:var(--f-display);font-weight:750;font-size:20px;padding:4px 10px 14px;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;border-radius:3px;background:var(--accent);display:inline-block}
.side nav{display:flex;flex-direction:column;gap:2px}
.side a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:var(--ink);text-decoration:none;font-weight:500}
.side a:hover{background:var(--bg)}
.side a.on{background:var(--accent-soft);color:var(--accent)}
.side a span.n{margin-left:auto;color:var(--muted);font-family:var(--f-mono);font-size:12.5px}
.side a i.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.side-h{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:16px 10px 4px;font-weight:600}
.sync{margin-top:auto;font-size:12.5px;color:var(--muted);padding:10px;display:flex;align-items:center;gap:8px}
.sync b{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}
.sync.local b{background:var(--warn)}
.syncbtn{text-align:left}
.mobile-sync{padding:0 0 10px}
@media (min-width:900px){.mobile-sync{display:none}}

/* ---------- View header ---------- */
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.vh h1{font-size:32px;font-weight:750;line-height:1.05}
.vh .sub{color:var(--muted);margin:4px 0 0}
.daynav{display:flex;align-items:center;gap:10px}
.iconbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--ink);flex:none}
.iconbtn:hover{border-color:var(--muted)}
.iconbtn svg{width:18px;height:18px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:500;font-size:13.5px}
.startbox{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13.5px}
.startbox input{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 8px;font-family:var(--f-mono)}
.datebtn{position:relative;overflow:hidden}
.datebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:12px}
.wd{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 2px 6px;border-radius:10px;background:var(--surface);border:1px solid var(--line);min-width:0}
.wd small{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.wd b{font-family:var(--f-mono);font-size:16px;font-weight:600;line-height:1.2}
.wd span{font-family:var(--f-mono);font-size:11px;color:var(--muted);min-height:14px;white-space:nowrap}
.wd.today b{color:var(--accent)}
.wd.past{opacity:.6}
.wd.full span{color:var(--good);font-weight:600}
.wd.on{background:var(--accent);border-color:var(--accent);opacity:1}
.wd.on small,.wd.on b,.wd.on span{color:var(--accent-ink)}
.weeknav{display:flex;align-items:center;justify-content:space-between;margin:-4px 0 6px;font-size:12.5px;color:var(--muted)}
.weeknav button{color:var(--accent);font-weight:500;padding:4px 2px}
.daychips button small{opacity:.75;margin-left:4px;font-family:var(--f-mono);font-size:11.5px}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-weight:500;margin-bottom:8px}
@media (min-width:900px){.back{display:none}}

/* ---------- Summary ---------- */
.summary{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.summary div small{display:block;color:var(--muted);font-size:12px}
.summary div b{font-family:var(--f-mono);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.bar{grid-column:1/-1;height:6px;border-radius:6px;background:var(--bg);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--good);border-radius:6px;transition:width .3s}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:var(--r);margin-bottom:12px;background:color-mix(in srgb,var(--warn) 13%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 35%,var(--line));font-size:14px}
.banner.info{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,var(--line))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:10px;font-weight:600;font-size:14px;background:var(--surface);border:1px solid var(--line);color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.small{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.block{width:100%}

/* ---------- Plan list ---------- */
.plan,.tasks,.flist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.row{position:relative;display:grid;grid-template-columns:18px 54px 30px 1fr 40px;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 8px 10px 4px;transition:transform .18s ease,box-shadow .18s;touch-action:pan-y}
.row::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--c,var(--line))}
.row.dragging{z-index:5;box-shadow:var(--shadow);transition:none}
.handle{color:var(--muted);opacity:.55;cursor:grab;touch-action:none;display:grid;place-items:center;height:100%;padding-left:4px}
.handle svg{width:12px;height:18px}
.time{display:flex;flex-direction:column;font-family:var(--f-mono);font-variant-numeric:tabular-nums;line-height:1.2}
.time b{font-weight:600;font-size:14.5px}
.time span{color:var(--muted);font-size:12px}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid color-mix(in srgb,var(--c,var(--muted)) 70%,var(--line));display:grid;place-items:center;color:transparent}
.chk svg{width:14px;height:14px}
.row.done .chk{background:var(--c,var(--good));border-color:var(--c,var(--good));color:#fff}
.body{min-width:0;cursor:pointer}
.title{font-weight:500;overflow-wrap:anywhere}
.row.done .title{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 60%,transparent)}
.meta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;color:var(--muted);font-size:12.5px;margin-top:2px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--bg);color:var(--muted)}
.chip.now{background:var(--accent-soft);color:var(--accent)}
.chip.late{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.chip.run{background:var(--accent);color:var(--accent-ink)}
.chip.p3{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.chip.p2{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.chip.p1{background:var(--bg);color:var(--muted)}
.chip.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.chip.inplan{background:var(--accent-soft);color:var(--accent)}
.play{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 12%,transparent)}
.play svg{width:16px;height:16px}
.row.done .play{visibility:hidden}
.row.now{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));box-shadow:0 0 0 3px var(--accent-soft)}
.row.running{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.row.pause{background:transparent;border-style:dashed}
.row.pause .title{color:var(--muted);font-style:italic}
.row.pause .chk{border-style:dashed}
.addrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.addrow .btn{flex:1}
.empty{text-align:center;color:var(--muted);padding:28px 16px;border:1px dashed var(--line);border-radius:var(--r)}

/* ---------- Tasks ---------- */
.task{grid-template-columns:18px 30px 1fr auto}
.task.manual-off{grid-template-columns:30px 1fr auto;padding-left:10px}
.today-btn{font-size:12.5px;font-weight:600;color:var(--accent);padding:6px 10px;border-radius:8px;background:var(--accent-soft);white-space:nowrap}
.addform{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.addform input[type=text]{flex:1 1 220px;min-width:0}
.field,.addform input[type=text],.addform select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;margin-bottom:12px}
.seg button{padding:5px 11px;border-radius:7px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.linkbtn{color:var(--accent);font-weight:500;font-size:14px;padding:6px 0}
.section-h{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px}
.section-h h3{font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px}
.section-h h3 i{width:11px;height:11px;border-radius:50%;background:var(--c)}

/* ---------- Folders ---------- */
.frow{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px;transition:transform .18s}
.frow.dragging{z-index:5;box-shadow:var(--shadow);transition:none}
.frow .fic{width:34px;height:34px;border-radius:50%;background:var(--c);display:grid;place-items:center;color:#fff;font-weight:700;font-family:var(--f-display);font-size:14px;flex:none}
.frow .fname{flex:1;font-weight:500;cursor:pointer;min-width:0}
.frow .fname small{display:block;color:var(--muted);font-weight:400;font-size:12.5px}
.frow .cnt{font-family:var(--f-mono);color:var(--muted)}

/* ---------- Templates ---------- */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;border-top:3px solid var(--c)}
.tcard .tt{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.tcard .tt b{font-weight:600}
.tcard .tt small{font-family:var(--f-mono);color:var(--muted);font-size:12.5px;white-space:nowrap}
.tcard .ta{display:flex;gap:6px}
.tcard .ta .btn{flex:1;padding:7px 8px;font-size:13px}
.more{color:var(--muted);width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none}
.more:hover{background:var(--bg)}
.more svg{width:18px;height:18px}

/* ---------- Mini timer ---------- */
.mini{position:fixed;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 10px);z-index:19;display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 10px 10px 14px;box-shadow:var(--shadow);cursor:pointer;max-width:560px;margin:0 auto}
.mini[hidden]{display:none}
.mini i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.mini .mt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.mini .mc{font-family:var(--f-mono);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}
.mini .mo{background:color-mix(in srgb,var(--bg) 18%,transparent);color:var(--bg);border-radius:9px;padding:6px 10px;font-weight:600;font-size:13px}
@media (min-width:900px){.mini{left:auto;right:28px;bottom:24px;width:420px}}

/* ---------- Timer overlay ---------- */
.ov{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 14px) 20px calc(env(safe-area-inset-bottom) + 24px);overflow:auto}
.ov[hidden]{display:none}
.ov-top{width:100%;max-width:560px;display:flex;justify-content:space-between;align-items:center}
.ov-c{flex:1;width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:12px 0}
.ov-sub{color:var(--muted);font-weight:500;display:flex;align-items:center;gap:8px;justify-content:center}
.ov-sub i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.ov h2{font-size:26px;font-weight:750;max-width:480px}
.ring{position:relative;width:min(300px,72vw);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{stroke:var(--line)}
.ring .prg{stroke:var(--c);transition:stroke-dashoffset .5s linear}
.ring .big{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .big b{font-family:var(--f-mono);font-size:clamp(44px,13vw,64px);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ring .big small{color:var(--muted);font-size:14px}
.ov-act{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%;max-width:420px}
.ov-act .btn{padding:13px;font-size:15px}
.ov-act .full{grid-column:1/-1}
.ov.finished .ring .prg{stroke:var(--good)}
.upnext{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;align-items:center;gap:12px;text-align:left}
.upnext i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.upnext div{flex:1;min-width:0}
.upnext small{color:var(--muted);display:block;font-size:12.5px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.ov.finished .ring{animation:pulse 1.4s ease-in-out infinite}


/* ---------- iPhone: kompakter ---------- */
@media (max-width:600px){
  .main{padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
  .vh{margin-bottom:12px;gap:8px}
  .vh h1{font-size:26px}
  .vh .sub{font-size:13.5px}
  .daynav{gap:8px}
  .iconbtn{width:32px;height:32px;border-radius:9px}
  .startbox{width:100%;font-size:13px}
  .startbox input{padding:4px 8px}
  .week{gap:4px}
  .wd{padding:6px 1px 5px}
  .wd b{font-size:14.5px}
  .wd span{font-size:10px}
  .summary{padding:10px 12px;gap:6px}
  .summary div b{font-size:16px}
  .row{grid-template-columns:14px 44px 26px minmax(0,1fr) 34px;gap:6px;padding:9px 6px 9px 2px}
  .row::before{top:8px;bottom:8px;width:3px}
  .time b{font-size:13.5px}
  .time span{font-size:11px}
  .chk{width:24px;height:24px}
  .play{width:34px;height:34px}
  .play svg{width:14px;height:14px}
  .title{font-size:14.5px;line-height:1.3}
  .meta{font-size:12px}
  .task{grid-template-columns:14px 26px minmax(0,1fr) auto}
  .task.manual-off{grid-template-columns:26px minmax(0,1fr) auto;padding-left:8px}
  .today-btn{padding:5px 8px;font-size:12px}
  .mini{padding:8px 8px 8px 12px;gap:10px}
  .mini .mc{font-size:15px}
  .tgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
}

/* ---------- Sheet ---------- */
#sheet{position:fixed;inset:0;z-index:50}
#sheet[hidden]{display:none}
.sh-bg{position:absolute;inset:0;background:rgba(10,14,22,.42)}
.sh{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:18px max(18px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 18px) max(18px,env(safe-area-inset-left));box-shadow:var(--shadow)}

.fl{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}

.chips button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tplchip{display:inline-flex;align-items:center;gap:6px}
.tplchip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.sh-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.sh-row .btn{flex:1}
.sh-group{margin-bottom:14px}
.sh-group > small{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
.sh-group > small i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}

.choice{display:flex;flex-direction:column;gap:8px}
.choice .btn{justify-content:space-between;padding:13px 14px}
.choice .btn small{font-family:var(--f-mono);font-weight:500;opacity:.85}
.note{color:var(--muted);font-size:13px;margin:4px 0 12px}
.check{display:flex;align-items:center;gap:8px;font-weight:500}
.stepper{display:flex;align-items:center;gap:6px}
.stepper input{width:76px;text-align:center;font-family:var(--f-mono)}

/* ---------- Toast & loading ---------- */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 76px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:500;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media (min-width:900px){#toast{bottom:28px}}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--muted);text-align:center;gap:10px}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 0.9s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

  <aside class="side" id="side"></aside>

</div>

<script>
"use strict";
/* ================= Helpers ================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const DEV=uid();
const pad=n=>String(n).padStart(2,"0");
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayKey=()=>dkey(new Date());
const addDays=(k,n)=>{const[y,m,d]=k.split("-").map(Number);return dkey(new Date(y,m-1,d+n));};
const keyDate=k=>{const[y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d);};
const toMin=s=>{const[h,m]=String(s||"0:0").split(":").map(Number);return (h||0)*60+(m||0);};
const hm=m=>{m=Math.round(m);m=((m%1440)+1440)%1440;return pad(Math.floor(m/60))+":"+pad(m%60);};
const msToMin=ts=>{const d=new Date(ts);return d.getHours()*60+d.getMinutes()+d.getSeconds()/60;};
const nowMin=()=>msToMin(Date.now());
const fmtDur=m=>{m=Math.round(m);if(m<60)return m+" min";const h=Math.floor(m/60),r=m%60;return h+" h"+(r?" "+r+" min":"");};
const fmtClock=ms=>{const t=Math.max(0,Math.ceil(ms/1000));const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return h?`${h}:${pad(m)}:${pad(s)}`:`${pad(m)}:${pad(s)}`;};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const clone=o=>JSON.parse(JSON.stringify(o));
const COLORS=["#3E8EF7","#30A46C","#F08C2E","#A15CD6","#E5484D","#12A594","#D6409F","#6E7B8B"];
const DURS=[10,15,20,25,30,45,60,75,90,120];
const ACTIONS=["Vorarbeiten","Nacharbeiten","Übungsserie","Definitionen & Sätze","Mitschrift nachholen","Formelsammlung anschauen","Repetieren","Prüfungsvorbereitung","Programmieren üben","Skript lesen"];
const PRIO={3:"Hoch",2:"Mittel",1:"Tief"};
const ICON={
  play:'<svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.5v11a.5.5 0 0 0 .77.42l8.5-5.5a.5.5 0 0 0 0-.84l-8.5-5.5A.5.5 0 0 0 4 2.5z"/></svg>',
  check:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"/></svg>',
  grip:'<svg viewBox="0 0 12 18" fill="currentColor"><circle cx="3" cy="3" r="1.5"/><circle cx="9" cy="3" r="1.5"/><circle cx="3" cy="9" r="1.5"/><circle cx="9" cy="9" r="1.5"/><circle cx="3" cy="15" r="1.5"/><circle cx="9" cy="15" r="1.5"/></svg>',
  left:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4.5L7 10l5.5 5.5"/></svg>',
  right:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 4.5L13 10l-5.5 5.5"/></svg>',
  x:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l10 10M15 5L5 15"/></svg>',
  dots:'<svg viewBox="0 0 20 20" fill="currentColor"><circle cx="4.5" cy="10" r="1.7"/><circle cx="10" cy="10" r="1.7"/><circle cx="15.5" cy="10" r="1.7"/></svg>',
  today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2.5h6"/></svg>',
  folder:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4.4l2 2h8.6A1.5 1.5 0 0 1 21 9.5v8A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5z"/></svg>',
  cal:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="14" height="12.5" rx="2"/><path d="M3 8.5h14M7 2.8v3.4M13 2.8v3.4"/></svg>',
  tpl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>'
};

/* ================= Seed (erster Start) ================= */
function seedData(){
  const folders=[
    {id:"schule",name:"Schule",short:"Schule",color:"#E5484D"},
    {id:"an1",name:"Analysis 1",short:"Analysis",color:"#3E8EF7"},
    {id:"la1",name:"Lineare Algebra 1",short:"Lineare Algebra",color:"#30A46C"},
    {id:"phy",name:"Physik",short:"Physik",color:"#F08C2E"},
    {id:"inf",name:"Informatik",short:"Informatik",color:"#A15CD6"},
    {id:"infu",name:"Informatik Übungen",short:"Informatik",color:"#C084FC"}
  ];
  const T=(folderId,action,dur)=>({id:uid(),folderId,action,dur});
  const templates=[
    T("an1","Übungsserie",30),T("an1","Vorarbeiten",60),T("an1","Nacharbeiten",45),T("an1","Definitionen & Sätze",30),
    T("la1","Übungsserie",45),T("la1","Vorarbeiten",60),T("la1","Nacharbeiten",60),T("la1","Definitionen & Sätze",30),
    T("phy","Übungsserie",45),T("phy","Mitschrift nachholen",45),T("phy","Nacharbeiten",45),T("phy","Formelsammlung anschauen",30),
    T("inf","Nacharbeiten",60),T("inf","Programmieren üben",60),T("inf","Vorarbeiten",45),
    T("infu","Übungsserie",60)
  ];
  const tasks={list:[
    {id:uid(),folderId:"phy",title:"Gravitation (vielleicht Starrkörper)",prio:2,due:null,notes:"",done:false}
  ]};
  const plans={days:{}};
  const k=todayKey();
  if(k==="2026-11-11"){
    const I=(title,folderId,dur,extra)=>({id:uid(),title,folderId,dur,done:false,fixed:null,aStart:null,aEnd:null,taskId:null,pause:false,...(extra||{})});
    plans.days[k]={start:"15:00",items:[
      I("Analysis Übungsserie","an1",30),
      I("Lineare Algebra nachholen (Definitionen & Sätze weiterführen)","la1",60),
      I("Informatik nachholen und Übungsstunde","inf",60),
      I("Physik Mitschrift nachholen","phy",45),
      I("Pause","",30,{pause:true,folderId:null}),
      I("Formelsammlung Physik anschauen","phy",30),
      I("Analysis nachholen (Riemann-Summen)","an1",45),

  return {meta:{folders,templates,settings:{dayStart:"15:00"}},tasks,plans,timer:{run:null}};
}

/* ================= Store / Sync (lokal + privates GitHub-Gist) ================= */
const DOCS=["meta","tasks","plans","timer"];
const S={meta:null,tasks:null,plans:null,timer:null};
let mode="loading";
const LS="lernplaner_";
const stamp={}; // letzte Änderungszeit pro Dokument
const GIST_FILE="lernplaner.json", GIST_DESC="lernplaner-data (nicht löschen)";
const cfg={token:null,gistId:null};
let syncState="off", pushT=null, pushing=false, dirty=false, lastPull=0;
function lsGet(k){try{const v=localStorage.getItem(LS+k);return v?JSON.parse(v):null;}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(LS+k,JSON.stringify(v));}catch(e){}}
function persistLocal(){DOCS.forEach(n=>lsSet(n,S[n]));lsSet("stamp",stamp);}
function save(name){
  if(name==="plans") prune();
  stamp[name]=Date.now(); persistLocal();
  if(cfg.token&&cfg.gistId){dirty=true;clearTimeout(pushT);pushT=setTimeout(push,1500);}
}
function prune(){const lim=addDays(todayKey(),-60);for(const k of Object.keys(S.plans.days)) if(k<lim) delete S.plans.days[k];}
async function gh(path,opt){
  const r=await fetch("https://api.github.com"+path,{...opt,headers:{"Authorization":"Bearer "+cfg.token,"Accept":"application/vnd.github+json",...(opt&&opt.body?{"Content-Type":"application/json"}:{})},cache:"no-store"});
  if(r.status===401) throw new Error("token");
  if(!r.ok) throw new Error("http "+r.status);
  return r.json();
}
function bundle(){const o={};DOCS.forEach(n=>o[n]={t:stamp[n]||0,d:S[n]});return o;}
async function push(){
  if(pushing){dirty=true;return;} if(!dirty) return;
  pushing=true; dirty=false; setSync("busy");
  try{
    await gh("/gists/"+cfg.gistId,{method:"PATCH",body:JSON.stringify({files:{[GIST_FILE]:{content:JSON.stringify(bundle())}}})});
    setSync("ok");
  }catch(e){dirty=true;setSync(e.message==="token"?"err":"offline");}
  pushing=false; if(dirty) pushT=setTimeout(push,4000);
}
async function pull(){
  if(!cfg.token||!cfg.gistId||pushing||dirty) return;
  lastPull=Date.now();
  try{
    const g=await gh("/gists/"+cfg.gistId);
    const f=g.files&&g.files[GIST_FILE]; if(!f) return;
    let txt=f.content; if(f.truncated){const r=await fetch(f.raw_url,{cache:"no-store"});txt=await r.text();}
    const remote=JSON.parse(txt||"{}"); let changed=false, localNewer=false;
    DOCS.forEach(n=>{const rd=remote[n]; if(!rd||!rd.d) {if(S[n]) localNewer=true; return;}
      if((rd.t||0)>(stamp[n]||0)){S[n]=rd.d;stamp[n]=rd.t;changed=true;} else if((rd.t||0)<(stamp[n]||0)) localNewer=true;});
    normalize(); autoCarry();
    if(changed){persistLocal();requestRender();}
    if(localNewer){dirty=true;push();}
    setSync("ok");
  }catch(e){setSync(e.message==="token"?"err":"offline");}
}
async function connectGist(token){
  cfg.token=token.trim();
  const list=await gh("/gists?per_page=100");
  const found=list.find(g=>g.description===GIST_DESC&&g.files&&g.files[GIST_FILE]);
  if(found){cfg.gistId=found.id;}
  else{const g=await gh("/gists",{method:"POST",body:JSON.stringify({description:GIST_DESC,public:false,files:{[GIST_FILE]:{content:JSON.stringify(bundle())}}})});cfg.gistId=g.id;}
  lsSet("cfg",cfg);
  if(found){DOCS.forEach(n=>stamp[n]=stamp[n]&&found?Math.min(stamp[n],1):0);} // beim Verbinden gewinnt der Cloud-Stand
  await pull();
}
function normalize(){
  S.tasks=S.tasks||{list:[]}; S.tasks.list=S.tasks.list||[];
  S.plans=S.plans||{days:{}}; S.plans.days=S.plans.days||{};
  S.timer=S.timer||{run:null};
  S.meta.settings=S.meta.settings||{dayStart:"15:00"};
}
function setSync(s){
  if(s) syncState=s;
  const txt={off:"Sync aus · tippen zum Einrichten",ok:"Synchronisiert",busy:"Speichere …",offline:"Offline · später erneut",err:"Token ungültig · neu einrichten"}[syncState];
  $$(".syncbtn").forEach(el=>{el.classList.toggle("local",!(syncState==="ok"||syncState==="busy"));el.lastChild.textContent=" "+txt;});
}
function openSyncSheet(){
  const on=!!(cfg.token&&cfg.gistId);
  openSheet("Synchronisieren",`
    <p class="note">Deine Daten werden in einem <b>privaten Gist</b> auf deinem GitHub-Konto gespeichert. Richte das auf jedem Gerät (Mac, iPad, iPhone) einmal mit demselben Token ein.</p>
    ${on?`<p class="note">Verbunden. Letzter Abgleich: ${lastPull?new Date(lastPull).toLocaleTimeString("de-CH",{hour:"2-digit",minute:"2-digit"}):"–"}</p>
      <div class="sh-row"><button class="btn danger" id="syOff">Trennen</button><button class="btn pri" id="syNow">Jetzt abgleichen</button></div>`
    :`<div class="fl"><label for="syTok">GitHub-Token (classic, nur Berechtigung „gist“)</label><input class="field" id="syTok" type="password" autocomplete="off" placeholder="ghp_…"></div>
      <p class="note">Token erstellen: github.com → Settings → Developer settings → Personal access tokens → Tokens (classic) → Generate new token → nur <b>gist</b> anhaken, Ablauf „No expiration“.</p>
      <button class="btn pri block" id="syGo">Verbinden</button><p class="note" id="syMsg"></p>`}`,sh=>{
    if(on){
      $("#syNow",sh).onclick=async()=>{dirty=true;await push();await pull();closeSheet();toast("Abgeglichen");};
      $("#syOff",sh).onclick=()=>{cfg.token=null;cfg.gistId=null;lsSet("cfg",cfg);setSync("off");closeSheet();};
    }else{
      $("#syGo",sh).onclick=async()=>{
        const t=$("#syTok",sh).value; if(!t.trim()) return;
        $("#syMsg",sh).textContent="Verbinde …";
        try{await connectGist(t);closeSheet();render();toast("Sync eingerichtet");}
        catch(e){cfg.token=null;cfg.gistId=null;$("#syMsg",sh).textContent=e.message==="token"?"Token ungültig oder ohne „gist“-Berechtigung.":"Keine Verbindung zu GitHub. Internet prüfen.";}
      };
    }
  });
}
document.addEventListener("click",e=>{if(e.target.closest(".syncbtn"))openSyncSheet();});
/* Offene Aufgaben früherer Tage automatisch auf heute übernehmen */
function autoCarry(){
  if(!S.plans||!S.plans.days) return false;
  const t=todayKey(), r=run(), open=[];
  for(const k of Object.keys(S.plans.days).filter(x=>x<t).sort()){
    const d=S.plans.days[k];
    const keep=[];
    for(const i of d.items){
      const active=r&&r.date===k&&r.itemId===i.id;
      if(i.done||i.pause||active) keep.push(i); else open.push(i);
    }
    d.items=keep;
  }
  if(!open.length) return false;
  const today=dayOf(t,true), have=new Set(today.items.map(i=>i.id));
  open.forEach(i=>{if(have.has(i.id)) return; i.fixed=null; today.items.push(i);});
  save("plans"); requestRender();
  return true;
}
async function init(){
  DOCS.forEach(n=>S[n]=lsGet(n)); Object.assign(stamp,lsGet("stamp")||{});
  Object.assign(cfg,lsGet("cfg")||{});
  if(!S.meta){const sd=seedData();DOCS.forEach(n=>{S[n]=sd[n];stamp[n]=1;});persistLocal();}
  normalize(); autoCarry(); mode="local"; syncState=cfg.token&&cfg.gistId?"busy":"off";
  render();
  if(cfg.token&&cfg.gistId) await pull();
  setInterval(()=>{if(!document.hidden){autoCarry();pull();}},30000);
  document.addEventListener("visibilitychange",()=>{if(document.hidden){if(dirty)push();}else{autoCarry();pull();}});
}
/* ================= Model helpers ================= */
const folder=id=>S.meta.folders.find(f=>f.id===id);
const fcolor=id=>(folder(id)||{}).color||"#8A94A6";
const dayOf=(k,create)=>{let d=S.plans.days[k];if(!d){d={start:(S.meta.settings&&S.meta.settings.dayStart)||"15:00",items:[]};if(create)S.plans.days[k]=d;}return d;};
const run=()=>S.timer&&S.timer.run;
const runLeft=r=>r.pausedLeft!=null?r.pausedLeft:Math.max(0,r.endsAt-Date.now());

function sched(k){
  const day=dayOf(k), r=run(), isToday=k===todayKey(), n=nowMin();
  let cur=toMin(day.start);
  return day.items.map(it=>{
    let s,e,state="";
    if(r&&r.date===k&&r.itemId===it.id&&!it.done){
      s=msToMin(r.startedAt); e=n+runLeft(r)/60000; state=r.pausedLeft!=null?"paused":"running";
    }else if(it.done&&it.aStart!=null){
      s=it.aStart; e=Math.max(it.aEnd!=null?it.aEnd:it.aStart+it.dur,s);
    }else{
      s=it.fixed!=null?Math.max(cur,it.fixed):cur; e=s+it.dur;
      if(!it.done&&isToday){ if(n>=s&&n<e) state="now"; else if(n>=e) state="late"; }
    }
    cur=e;
    return {it,s,e,state};
  });
}
function reorderSubset(arr,pred,id,newIdx){
  const idxs=[],sub=[];
  arr.forEach((x,i)=>{if(pred(x)){idxs.push(i);sub.push(x);}});
  const from=sub.findIndex(x=>x.id===id); if(from<0) return;
  const [m]=sub.splice(from,1); sub.splice(newIdx,0,m);
  idxs.forEach((gi,j)=>arr[gi]=sub[j]);
}
function addToPlan(k,item,at){
  const day=dayOf(k,true);
  const it={id:uid(),title:"",folderId:null,dur:30,done:false,fixed:null,aStart:null,aEnd:null,taskId:null,pause:false,...item};
  if(at==null||at<0) day.items.push(it); else day.items.splice(at,0,it);
  save("plans"); return it;
}
function tplTitle(t){const f=folder(t.folderId);return (f?f.short||f.name:"")+" "+t.action;}
function openCount(fid){return S.tasks.list.filter(t=>t.folderId===fid&&!t.done).length;}
function linkTaskDone(taskId,done){
  if(!taskId) return; const t=S.tasks.list.find(x=>x.id===taskId);
  if(t&&t.done!==done){t.done=done;t.doneAt=done?Date.now():null;save("tasks");}
}

/* ================= Routing & render ================= */
function route(){
  const h=(location.hash||"#heute").slice(1);
  if(h.startsWith("f-")) return {view:"folder",fid:h.slice(2)};
  if(h==="ordner") return {view:"folders"};
  if(h==="vorlagen") return {view:"templates"};
  return {view:"today"};
}
const ui={day:todayKey(),sort:"manual",showDone:false,timerOpen:false,editOrder:false,lastMinute:-1};
let renderPending=false, dragActive=false;
function requestRender(){
  const a=document.activeElement;
  if(dragActive||(a&&$("#view").contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))){renderPending=true;return;}
  render();
}
document.addEventListener("focusout",()=>setTimeout(()=>{if(renderPending&&!dragActive){renderPending=false;render();}},50));

function _oldSetSync(ok){const el=$("#syncState");if(el){el.className="sync"+(ok&&mode==="cloud"?"":" local");el.lastChild.textContent=ok&&mode==="cloud"?" Synchronisiert":" Nur auf diesem Gerät";}}

function render(){
  if(mode==="loading") return;
  renderPending=false;
  const r=route();
  // Seitenleiste
  const todayUndone=dayOf(todayKey()).items.filter(i=>!i.done&&!i.pause).length;
  $("#side").innerHTML=`

/* ---------- Heute ---------- */
function dayLabel(k){
  const t=todayKey();
  if(k===t) return "Heute"; if(k===addDays(t,1)) return "Morgen"; if(k===addDays(t,-1)) return "Gestern";
  return keyDate(k).toLocaleDateString("de-CH",{weekday:"long"});
}
function dayShort(k){
  const t=todayKey();
  if(k===t) return "heute"; if(k===addDays(t,1)) return "morgen";
  return keyDate(k).toLocaleDateString("de-CH",{weekday:"short",day:"numeric",month:"numeric"});
}
function fmtShort(m){if(!m) return ""; if(m<60) return m+"′"; return (Math.round(m/30)/2).toLocaleString("de-CH")+" h";}
function dayStats(k){
  const d=S.plans.days[k]; if(!d) return {min:0,n:0,done:0};
  const w=d.items.filter(i=>!i.pause);
  return {min:w.reduce((a,i)=>a+i.dur,0),n:w.length,done:w.filter(i=>i.done).length};
}
function weekStrip(k){
  const t=todayKey(), dow=(keyDate(k).getDay()+6)%7, mon=addDays(k,-dow);
  const keys=[0,1,2,3,4,5,6].map(i=>addDays(mon,i));
  const kw=(()=>{const d=keyDate(mon);d.setDate(d.getDate()+3);const y=new Date(d.getFullYear(),0,4);return 1+Math.round(((d-y)/864e5-3+((y.getDay()+6)%7))/7);})();
  const wkMin=keys.reduce((a,x)=>a+dayStats(x).min,0);
  return `<div class="weeknav"><button data-act="prevWeek">‹ Vorwoche</button><span>KW ${kw}${wkMin?` · ${fmtDur(wkMin)} geplant`:""}</span><button data-act="nextWeek">Nächste Woche ›</button></div>
  <div class="week" role="group" aria-label="Woche">${keys.map(x=>{
    const st=dayStats(x), cls=["wd"]; if(x===k)cls.push("on"); if(x===t)cls.push("today"); if(x<t)cls.push("past"); if(st.n&&st.done===st.n)cls.push("full");
    const d=keyDate(x);
    return `<button class="${cls.join(" ")}" data-act="pickDay" data-k="${x}" aria-label="${d.toLocaleDateString("de-CH",{weekday:"long",day:"numeric",month:"long"})}${st.min?", "+fmtDur(st.min)+" geplant":""}">
      <small>${d.toLocaleDateString("de-CH",{weekday:"short"}).replace(".","")}</small><b>${d.getDate()}</b><span>${st.n&&st.done===st.n?"✓":fmtShort(st.min)}</span></button>`;
  }).join("")}</div>`;
}
function nextPlanned(taskId){
  const t=todayKey();
  return Object.keys(S.plans.days).filter(k=>k>=t).sort().find(k=>S.plans.days[k].items.some(i=>i.taskId===taskId&&!i.done));
}
function viewToday(){

function rowHTML(x){
  const it=x.it, f=folder(it.folderId), c=it.pause?"var(--line)":fcolor(it.folderId);
  const cls=["row","it"]; if(it.done)cls.push("done"); if(it.pause)cls.push("pause");

  if(x.state==="now") chip='<span class="chip now">jetzt</span>';
  else if(x.state==="late") chip='<span class="chip late">verspätet</span>';
  else if(x.state==="running") chip=`<span class="chip run">läuft · <span class="mono live-left">${fmtClock(runLeft(run()))}</span></span>`;
  else if(x.state==="paused") chip=`<span class="chip late">pausiert · <span class="mono">${fmtClock(runLeft(run()))}</span></span>`;
  const metaBits=[];
  if(f&&!it.pause) metaBits.push(esc(f.name));
  metaBits.push(fmtDur(it.done&&it.aStart!=null&&it.aEnd!=null?Math.max(1,it.aEnd-it.aStart):it.dur));
  if(it.fixed!=null&&!it.done&&x.state!=="running"&&x.state!=="paused") metaBits.push("fix "+hm(it.fixed));
  return `<li class="${cls.join(" ")}" data-id="${it.id}" style="--c:${c}">
    <span class="handle" data-handle aria-label="Verschieben">${ICON.grip}</span>
    <div class="time"><b>${hm(x.s)}</b><span>${hm(x.e)}</span></div>
    <button class="chk" data-act="toggle" aria-label="${it.done?"Als offen markieren":"Erledigt"}">${ICON.check}</button>
    <div class="body" data-act="edit"><div class="title">${esc(it.title||"Ohne Titel")}</div><div class="meta">${metaBits.join(" · ")}${chip}</div></div>
    ${it.pause?"<span></span>":`<button class="play" data-act="start" aria-label="Timer starten">${ICON.play}</button>`}
  </li>`;
}

/* ================= Sortable (Maus + Touch) ================= */
function makeSortable(listEl,onDrop){
  listEl.addEventListener("pointerdown",e=>{
    const h=e.target.closest("[data-handle]"); if(!h||!listEl.contains(h)) return;
    const row=h.closest("[data-id]"); if(!row) return;
    e.preventDefault();
    const rows=$$(":scope > [data-id]",listEl); if(rows.length<2) return;
    const idx=rows.indexOf(row), rect=row.getBoundingClientRect();
    const gap=parseFloat(getComputedStyle(listEl).rowGap)||0, step=rect.height+gap;
    const mids=rows.map(r=>{const b=r.getBoundingClientRect();return b.top+b.height/2;});
    const startY=e.clientY; let target=idx;
    dragActive=true; row.classList.add("dragging");
    try{h.setPointerCapture(e.pointerId);}catch(_){}
    const move=ev=>{
      const dy=ev.clientY-startY; row.style.transform=`translateY(${dy}px)`;
      const y=rect.top+rect.height/2+dy;
      target=mids.filter((m,i)=>i!==idx&&m<y).length;
      rows.forEach((r,i)=>{ if(r===row) return; let s=0;
        if(idx<target&&i>idx&&i<=target) s=-step; if(idx>target&&i>=target&&i<idx) s=step;
        r.style.transform=s?`translateY(${s}px)`:""; });
    };
    const up=()=>{
      h.removeEventListener("pointermove",move); h.removeEventListener("pointerup",up); h.removeEventListener("pointercancel",up);
      rows.forEach(r=>r.style.transform=""); row.classList.remove("dragging"); dragActive=false;
      if(target!==idx) onDrop(row.dataset.id,target); else if(renderPending) render();
    };
    h.addEventListener("pointermove",move); h.addEventListener("pointerup",up); h.addEventListener("pointercancel",up);
  });
}
function wireSortables(){
  const pl=$("#planList");
  if(pl) makeSortable(pl,(id,to)=>{const d=dayOf(ui.day,true);reorderSubset(d.items,()=>true,id,to);save("plans");render();});
  const tl=$("#taskList");
  if(tl&&ui.sort==="manual"){const fid=tl.dataset.fid;makeSortable(tl,(id,to)=>{reorderSubset(S.tasks.list,t=>t.folderId===fid&&!t.done,id,to);save("tasks");render();});}
  const fl=$("#folderList");
  if(fl&&ui.editOrder) makeSortable(fl,(id,to)=>{reorderSubset(S.meta.folders,()=>true,id,to);save("meta");render();});
}

/* ================= Aktionen ================= */
const planItem=id=>dayOf(ui.day).items.find(i=>i.id===id);
const ACT={
  prevDay(){ui.day=addDays(ui.day,-1);render();},
  nextDay(){ui.day=addDays(ui.day,1);render();},
  goToday(){ui.day=todayKey();render();},
  pickDay(_,el){ui.day=el.dataset.k;render();},
  prevWeek(){ui.day=addDays(ui.day,-7);render();},
  nextWeek(){ui.day=addDays(ui.day,7);render();},
  toggle(id){
    const it=planItem(id); if(!it) return;
    it.done=!it.done;
    if(!it.done){it.aStart=null;it.aEnd=null;}
    const r=run(); if(r&&r.itemId===id){S.timer.run=null;save("timer");}
    linkTaskDone(it.taskId,it.done);
    save("plans"); render();
  },
  edit(id){openItemSheet(id);},
  start(id){openStartSheet(ui.day,id);},
  addPlan(){openAddSheet();},
  addPause(){openPauseSheet();},
  reschedule(){
    const d=dayOf(todayKey(),true); const i=d.items.findIndex(x=>!x.done); if(i<0) return;
    const n=Math.ceil(nowMin()/5)*5;
    d.items.forEach((x,j)=>{ if(j>=i&&!x.done) x.fixed=null; });
    d.items[i].fixed=n; save("plans"); render(); toast("Ab "+hm(n)+" neu geplant");
  },
  carry(_,el){
    const pk=el.dataset.k, prev=S.plans.days[pk]; if(!prev) return;
    const open=prev.items.filter(i=>!i.done&&!i.pause);
    prev.items=prev.items.filter(i=>i.done||i.pause);
    const d=dayOf(todayKey(),true);
    open.forEach(i=>{i.fixed=null;d.items.push(i);});
    save("plans"); render(); toast(open.length+" übernommen");
  },
  openTimer(){ui.timerOpen=true;renderOverlay();},
  // Aufgaben
  tToggle(id){
    const t=S.tasks.list.find(x=>x.id===id); if(!t) return;
    t.done=!t.done; t.doneAt=t.done?Date.now():null; save("tasks");
    const pi=dayOf(todayKey()).items.find(i=>i.taskId===id&&i.done!==t.done);
    if(pi){pi.done=t.done; if(!t.done){pi.aStart=null;pi.aEnd=null;} save("plans");}
    render(); if(t.done) toast("Erledigt");
  },
  tEdit(id){openTaskSheet(id);},
  tToday(id){
    const t=S.tasks.list.find(x=>x.id===id); if(!t) return;
    const def=ui.day>=todayKey()?ui.day:todayKey();
    openDurSheet(`„${t.title}“ einplanen`,30,(dur,k)=>{
      addToPlan(k,{title:t.title,folderId:t.folderId,dur,taskId:t.id});
      render(); toast("Für "+dayShort(k)+" eingeplant");
    },def);
  },
  sort(_,el){ui.sort=el.dataset.s;render();},
  toggleDone(){ui.showDone=!ui.showDone;render();},
  clearDone(_,el){
    const fid=el.dataset.fid; const n=S.tasks.list.filter(t=>t.folderId===fid&&t.done).length;

function wireDur(root,id){
  const inp=$("#"+id,root), chips=$(`[data-durchips="${id}"]`,root);
  const sync=()=>$$("button",chips).forEach(b=>b.classList.toggle("on",Number(b.dataset.d)===Number(inp.value)));

/* ================= Timer ================= */
let actx=null, wake=null, rungFor=null;
function ensureAudio(){try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume();}catch(e){}}
document.addEventListener("pointerdown",ensureAudio,{passive:true});
function chime(){
  try{
    if(!actx) return; const t0=actx.currentTime;
    [0,.32,.64,1.5,1.82,2.14].forEach((dt,i)=>{
      const o=actx.createOscillator(),g=actx.createGain(); o.type="sine"; o.frequency.value=[784,987.8,1318.5][i%3];
      g.gain.setValueAtTime(.0001,t0+dt); g.gain.exponentialRampToValueAtTime(.28,t0+dt+.02); g.gain.exponentialRampToValueAtTime(.0001,t0+dt+.55);
      o.connect(g); g.connect(actx.destination); o.start(t0+dt); o.stop(t0+dt+.6);
    });
  }catch(e){}
  try{navigator.vibrate&&navigator.vibrate([250,120,250,120,250]);}catch(e){}
}
async function keepAwake(on){
  try{
    if(on&&!wake&&navigator.wakeLock){wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",()=>{wake=null;});}
    if(!on&&wake){await wake.release();wake=null;}
  }catch(e){wake=null;}
}
function openStartSheet(k,id){
  const rows=sched(k), x=rows.find(r=>r.it.id===id); if(!x) return;
  const it=x.it, n=nowMin(), isToday=k===todayKey(), r=run();
  const inSlot=isToday&&n>=x.s&&x.e-n>=1&&x.state!=="running";
  const slotLeft=Math.floor(x.e-n);
  const choices=[];
  if(inSlot&&slotLeft<it.dur) choices.push({m:slotLeft,label:`Bis ${hm(x.e)} (nach Plan)`,pri:true});
  choices.push({m:it.dur,label:`Volle Dauer`,pri:!choices.length});
  const warn=r&&!(r.itemId===id)?`<p class="note">Der laufende Timer für „${esc(((dayOf(r.date).items.find(i=>i.id===r.itemId))||{}).title||"Block")}“ wird gestoppt.</p>`:"";
  openSheet(it.title||"Timer starten",`
    <p class="note">${isToday?`Jetzt ${hm(n)} · geplant ${hm(x.s)}–${hm(x.e)}`:`Geplant für ${dayLabel(k)}, ${hm(x.s)}–${hm(x.e)}`}</p>${warn}
    <div class="choice">${choices.map(c=>`<button class="btn ${c.pri?"pri":""}" data-m="${c.m}"><span>${c.label}</span><small>${fmtDur(c.m)} · Ende ${hm(n+c.m)}</small></button>`).join("")}</div>
    <div class="fl" style="margin-top:16px"><label>Andere Dauer</label>${durPicker("stDur",it.dur)}</div>
    <button class="btn block" id="stCustom">Mit dieser Dauer starten</button>`,sh=>{
      const get=wireDur(sh,"stDur");
      $$(".choice [data-m]",sh).forEach(b=>b.addEventListener("click",()=>{closeSheet();startTimer(k,id,Number(b.dataset.m));}));
      $("#stCustom",sh).addEventListener("click",()=>{const m=get();closeSheet();startTimer(k,id,m);});
    });
}
function startTimer(k,id,minutes){
  ensureAudio();
  const now=Date.now(), ms=Math.max(1,minutes)*60000;
  // Block auf heute holen, falls er an einem anderen Tag geplant war
  if(k!==todayKey()){const src=dayOf(k,true),i=src.items.findIndex(x=>x.id===id);if(i>=0){const [it]=src.items.splice(i,1);it.fixed=null;dayOf(todayKey(),true).items.push(it);}k=todayKey();ui.day=k;save("plans");}
  S.timer.run={date:k,itemId:id,startedAt:now,endsAt:now+ms,pausedLeft:null,total:ms};
  rungFor=null; save("timer"); ui.timerOpen=true; keepAwake(true); render();
}
function finishRun(markDone){
  const r=run(); if(!r) return;
  const it=dayOf(r.date,true).items.find(i=>i.id===r.itemId);
  if(it&&markDone){
    it.done=true; it.aStart=msToMin(r.startedAt);
    const endTs=r.pausedLeft!=null?Date.now():Math.min(Date.now(),r.endsAt);
    it.aEnd=Math.max(it.aStart+1,msToMin(endTs)); it.fixed=null;
    linkTaskDone(it.taskId,true); save("plans");
  }
  S.timer.run=null; save("timer"); keepAwake(false);
  ui.justFinished=markDone?r.itemId:null;
  render();
}
function extendRun(min){
  const r=run(); if(!r) return;
  if(r.pausedLeft!=null) r.pausedLeft+=min*60000;
  else r.endsAt=Math.max(r.endsAt,Date.now())+min*60000;
  r.total+=min*60000; rungFor=null; save("timer"); renderOverlay(); renderMini();
}
function togglePause(){
  const r=run(); if(!r) return;
  if(r.pausedLeft!=null){r.endsAt=Date.now()+r.pausedLeft;r.pausedLeft=null;}
  else{r.pausedLeft=Math.max(0,r.endsAt-Date.now());r.endsAt=null;}
  save("timer"); renderOverlay(); renderMini(); if(route().view==="today") requestRender();
}
function nextUp(k){
  return sched(k).find(x=>!x.it.done&&!x.it.pause&&!(run()&&run().itemId===x.it.id));
}
function renderMini(){
  const m=$("#mini"), r=run();
  if(!r||ui.timerOpen){m.hidden=true;return;}
  const it=dayOf(r.date).items.find(i=>i.id===r.itemId);
  m.hidden=false; m.style.setProperty("--c",fcolor(it&&it.folderId));
  const left=runLeft(r);
  m.innerHTML=`<i></i><span class="mt">${esc(it?it.title:"Timer")}</span><span class="mc" id="miniClock">${left<=0&&r.pausedLeft==null?"Zeit um":fmtClock(left)}</span><span class="mo">${r.pausedLeft!=null?"Pausiert":"Öffnen"}</span>`;
  m.onclick=()=>{ui.timerOpen=true;renderOverlay();renderMini();};
}
const RC=2*Math.PI*46;
function renderOverlay(){
  const o=$("#ov"), r=run();
  if(!ui.timerOpen){o.hidden=true;document.body.classList.toggle("locked",!$("#sheet").hidden);renderMini();return;}
  document.body.classList.add("locked");
  if(!r){
    // Nach Abschluss: nächster Block
    const k=todayKey(), nx=nextUp(k), was=ui.justFinished?dayOf(k).items.find(i=>i.id===ui.justFinished):null;
    o.hidden=false; o.className="ov"; o.style.setProperty("--c",was?fcolor(was.folderId):"var(--accent)");
    o.innerHTML=`<div class="ov-top"><button class="iconbtn" id="ovClose" aria-label="Schliessen">${ICON.x}</button><span></span></div>
      <div class="ov-c">
        ${was?`<div class="ov-sub"><i></i>Erledigt</div><h2>${esc(was.title)}</h2>`:`<h2>Kein Timer aktiv</h2>`}
        ${nx?`<div class="upnext" style="--c:${fcolor(nx.it.folderId)}"><i></i><div><small>Als Nächstes · geplant ${hm(nx.s)}</small><b>${esc(nx.it.title)}</b></div><button class="btn pri small" id="ovNext">${ICON.play.replace("<svg",'<svg width="12" height="12"')} Start</button></div>`:`<p class="note">Für heute ist alles erledigt.</p>`}
        <div class="ov-act"><button class="btn full" id="ovBack">Zum Tagesplan</button></div>
      </div>`;
    const close=()=>{ui.timerOpen=false;ui.justFinished=null;renderOverlay();};
    $("#ovClose").onclick=close; $("#ovBack").onclick=close;
    if(nx) $("#ovNext").onclick=()=>{ui.timerOpen=false;renderOverlay();openStartSheet(k,nx.it.id);};
    return;
  }
  const it=dayOf(r.date).items.find(i=>i.id===r.itemId)||{title:"Timer"};
  const f=folder(it.folderId), left=runLeft(r), over=left<=0&&r.pausedLeft==null;
  o.hidden=false; o.className="ov"+(over?" finished":""); o.style.setProperty("--c",fcolor(it.folderId));
  const endTxt=r.pausedLeft!=null?"pausiert":"Ende um "+hm(msToMin(r.endsAt));
  o.innerHTML=`<div class="ov-top"><button class="iconbtn" id="ovMin" aria-label="Minimieren">${ICON.left}</button><span class="note" style="margin:0">${f?esc(f.name):""}</span></div>
    <div class="ov-c">
      <div class="ov-sub"><i></i>${over?"Zeit um!":r.pausedLeft!=null?"Pausiert":"Fokus"}</div>
      <h2>${esc(it.title)}</h2>
      <div class="ring"><svg viewBox="0 0 100 100"><circle class="trk" cx="50" cy="50" r="46" fill="none" stroke-width="4"/><circle class="prg" id="ovPrg" cx="50" cy="50" r="46" fill="none" stroke-width="4" stroke-linecap="round" stroke-dasharray="${RC}" stroke-dashoffset="${RC*(1-Math.min(1,left/r.total))}"/></svg>
        <div class="big"><b id="ovTime">${over?"00:00":fmtClock(left)}</b><small id="ovEnd">${endTxt}</small></div></div>
      ${over?`<div class="ov-act">
        <button class="btn pri full" id="ovDone">${ICON.check.replace("<svg",'<svg width="16" height="16"')} Erledigt</button>
        <button class="btn" data-ext="5">+5 min</button><button class="btn" data-ext="15">+15 min</button>
        <button class="btn full" id="ovStop">Stoppen, noch nicht fertig</button></div>`
      :`<div class="ov-act">
        <button class="btn pri" id="ovPause">${r.pausedLeft!=null?"Weiter":"Pause"}</button>
        <button class="btn" data-ext="5">+5 min</button>
        <button class="btn full" id="ovDone">${ICON.check.replace("<svg",'<svg width="16" height="16"')} Erledigt</button>
        <button class="btn full danger" id="ovStop">Timer abbrechen</button></div>`}
    </div>`;
  $("#ovMin").onclick=()=>{ui.timerOpen=false;renderOverlay();};
  $("#ovDone").onclick=()=>finishRun(true);
  $("#ovStop").onclick=()=>{ui.timerOpen=false;finishRun(false);};
  const p=$("#ovPause"); if(p) p.onclick=togglePause;
  $$("[data-ext]",o).forEach(b=>b.onclick=()=>extendRun(Number(b.dataset.ext)));
}
function tick(){
  if(mode==="loading") return;
  const r=run();
  if(r){
    const left=runLeft(r), over=left<=0&&r.pausedLeft==null;
    const t=$("#ovTime"); if(t) t.textContent=over?"00:00":fmtClock(left);
    const p=$("#ovPrg"); if(p) p.setAttribute("stroke-dashoffset",String(RC*(1-Math.min(1,left/r.total))));
    const mc=$("#miniClock"); if(mc) mc.textContent=over?"Zeit um":fmtClock(left);
    $$(".live-left").forEach(el=>el.textContent=fmtClock(left));
    const key=r.itemId+":"+r.endsAt;
    if(over&&rungFor!==key){rungFor=key; chime(); ui.timerOpen=true; renderOverlay(); renderMini();}
  }
  const m=Math.floor(nowMin());
  if(m!==ui.lastMinute){ui.lastMinute=m; if(route().view==="today"&&$("#sheet").hidden) requestRender();}
}
setInterval(tick,500);
document.addEventListener("visibilitychange",()=>{if(!document.hidden){tick();if(run()&&run().pausedLeft==null)keepAwake(true);}});

/* ================= Toast ================= */
let toastT=null;
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2200);}

init();
if("serviceWorker" in navigator&&location.protocol==="https:"){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
</script>
</body>
